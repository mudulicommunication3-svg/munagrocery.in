  <!-- ================= 📞 INCOMING ORDER CALL OVERLAY (WhatsApp/Telegram style) ================= -->
  <div id="newOrderAlertModal" class="fixed inset-0 z-[9999] hidden flex flex-col items-center justify-center p-4" role="dialog" aria-modal="true" aria-label="New order incoming call">
    <!-- Full-screen pulsing background ring (like WhatsApp/Telegram incoming call) -->
    <div class="absolute inset-0 bg-rose-900/90 backdrop-blur-sm overflow-hidden">
      <div class="absolute inset-0 bg-rose-600/20 rounded-full blur-[60px] animate-pulse"></div>
      <div class="absolute inset-0 bg-rose-600/10 rounded-full blur-[80px] animate-[pulse_4s_cubic-bezier(0.4,0,0.6,1)_infinite]"></div>
      <div class="relative z-10 flex flex-col items-center justify-center h-full w-full py-12 text-center">
        <!-- Incoming call icon + "Incoming Order" header -->
        <div class="relative z-20 w-24 h-24 rounded-full bg-white/10 flex items-center justify-center mx-auto mb-6 animate-pulse ring-4 ring-rose-500/30">
          <i class="ph-bold ph-shopping-bag text-4xl text-white"></i>
        </div>
        <h2 id="newOrderCallTitle" class="text-3xl font-extrabold text-white tracking-tight mb-2">Incoming Order</h2>
        <p id="newOrderCallSub" class="text-lg text-rose-100 mb-8 font-semibold">A new customer order is waiting</p>

        <!-- Timer -->
        <span id="newOrderRingTimer" class="text-[22px] font-black text-white bg-black/40 px-4 py-1 rounded-full mb-10 shadow-lg">15s</span>

        <!-- Order details card -->
        <div class="bg-white/5 backdrop-blur-md rounded-3xl p-6 border border-white/10 shadow-2xl w-full max-w-md mb-8 relative z-20">
          <div class="flex items-center justify-between gap-3 mb-3">
            <span id="newOrderTypeBadge" class="px-2 py-1 rounded-md text-[10px] font-black bg-blue-50 text-[#1864ab] border border-blue-200 whitespace-nowrap">Delivery</span>
            <span id="newOrderTime" class="text-[11px] text-slate-400 font-bold"></span>
          </div>
          <div class="space-y-2.5 text-sm">
            <div class="flex justify-between gap-2 text-slate-200">
              <span class="font-bold text-slate-300">🧾 Order</span><span id="newOrderId" class="font-black text-slate-800"></span>
            </div>
            <div class="flex justify-between gap-2 text-slate-200">
              <span class="font-bold text-slate-300">👤 Customer</span><span id="newOrderName" class="font-black text-slate-800"></span>
            </div>
            <div class="flex justify-between gap-2 text-slate-200">
              <span class="font-bold text-slate-300">📞 Phone</span><span id="newOrderPhone" class="font-black text-slate-800"></span>
            </div>
            <div class="flex justify-between gap-2 text-slate-200">
              <span class="font-bold text-slate-300">💰 Total</span><span id="newOrderTotal" class="font-black text-emerald-700"></span>
            </div>
            <div id="newOrderSlotRow" class="hidden flex justify-between gap-2 text-slate-200">
              <span class="font-bold text-slate-300">🏪 Pickup Slot</span><span id="newOrderSlot" class="font-black text-indigo-700"></span>
            </div>
          </div>
        </div>

        <!-- Auto quick-response: Accept / Reject / Review buttons ALWAYS visible
             for quick response while the ring plays (WhatsApp-call style). -->
        <div class="grid grid-cols-2 gap-4 w-full max-w-md mb-2 relative z-20">
          <button onclick="newOrderAlertAction('accept')" class="py-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-lg font-black shadow-lg shadow-emerald-900/20 transform active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="ph-bold ph-check text-lg"></i> <span>Accept ✅</span>
          </button>
          <button onclick="newOrderAlertAction('decline')" class="py-4 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white text-lg font-black shadow-lg shadow-rose-900/20 transform active:scale-95 transition-all flex items-center justify-center gap-2">
            <i class="ph-bold ph-x text-lg"></i> <span>Reject ❌</span>
          </button>
        </div>
        <button onclick="newOrderAlertAction('review')" class="w-full max-w-md py-2.5 rounded-2xl bg-white/15 hover:bg-white/25 text-white text-sm font-black relative z-20 border border-white/25 active:scale-95 transition-all flex items-center justify-center gap-2">
          <i class="ph-bold ph-eye text-sm"></i> <span>Review Order 👀</span>
        </button>
        <p class="text-[10px] text-rose-200/70 font-bold mt-2 relative z-20">ତୁରନ୍ତ Accept / Reject କରନ୍ତୁ — ଅନ୍ୟ ଆଡମିନ୍ ଫୋନ୍ ର ରିଙ୍ଗ୍ ବନ୍ଦ ହେବ</p>
      </div>
    </div>
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 text-white/60 text-[10px] font-bold uppercase tracking-widest relative z-20">
      ଯେକୌଣସି ଆଡମିନ୍ ଫୋନ୍ ରେ ଉତ୍ତର ଦେଲେ ସବୁ ଫୋନ୍ ର ରିଙ୍ଗ୍ ବନ୍ଦ ହେବ
    </div>
  </div>
