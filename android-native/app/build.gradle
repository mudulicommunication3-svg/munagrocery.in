plugins {
    id 'com.android.application'
}

android {
    namespace 'in.munagrocery.app'
    compileSdk 36

    defaultConfig {
        applicationId 'in.munagrocery.app'
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 16
        versionName '1.2.1'
    }

    packagingOptions {
        // Exclude junk java resources that old transitive deps smuggle in with
        // backslash separators (breaks zip alignment / strict installers).
        excludes += [
            'kotlin/**',
            'DebugProbesKt.bin',
            'META-INF/versions/**',
            'META-INF/com/**',
            'META-INF/*.kotlin_module',
            'META-INF/*.version',
            'META-INF/services/**'
        ]
    }

    // NOTE: keystore is currently unreadable (wrong password in repo). Build
    // produces an unsigned APK; it is then signed out-of-band with the working
    // keystore via apksigner. Re-enable signingConfig once keystore is fixed.

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
}
