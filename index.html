    <!-- Service worker: live order alert notification channel + offline shell -->
    <script>
      // Default production webhook (Apps Script deployment). Used whenever
      // this browser has no saved override. The admin can still override it
      // per-device from Admin -> Sheets (saved to localStorage).
      window.MUNNA_DEFAULT_WEBHOOK = 'https://script.google.com/macros/s/AKfycbyBG-2536FNp4Kdux8GSBjKMyHjaSBWqSIaJpHDQ68GtzKpyUYR9x_N9QthMdvXPNhE/exec';
      // Single place every webhook read goes through: saved override wins,
      // otherwise the built-in default. NEVER blank on a fresh browser.
      window.munnaHookBase = function () {
        try {
          var saved = (localStorage.getItem('munna_sheet_webhook') || '').trim();
          if (saved) return saved;
        } catch (e) {}
        return window.MUNNA_DEFAULT_WEBHOOK || '';
      };
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }

      // PUBLIC read-only server diagnostics for admin live order verification.
      window.munnaReadonlyGet = function (path) {
        var hook = window.munnaHookBase();
        if (!hook) return Promise.resolve({ ok: false, status: 0, url: '', json: null });
        var ctrl = new AbortController();
        var timeout = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 8000);
        return fetch(hook + (hook.indexOf('?') >= 0 ? '&' : '?') + path + '&_=' + Date.now(), {
          cache: 'no-store',
          signal: ctrl.signal
        }).then(function (res) {
          clearTimeout(timeout);
          return res.json().catch(function () { return null; }).then(function (json) {
            return { ok: res.ok, status: res.status, url: hook, json: json };
          });
        }).catch(function (e) {
          clearTimeout(timeout);
          return { ok: false, status: 0, url: hook, json: null, error: String((e && e.message) || e) };
        });
      };

      window.munnaShowOrderNotification = function (title, body) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return false;
        try {
          var tag = 'munna-new-order';
          var n = new Notification(title, {
            body: body,
            icon: 'icon-192.png',
            badge: 'icon-192.png',
            tag: tag,
            requireInteraction: true,
            renotify: true
          });
          n.onclick = function () { window.focus(); n.close(); };
          return true;
        } catch (e) { return false; }
      };
      window.munnaRequestOrderNotifications = function () {
        // NATIVE APP first: the Android bridge posts system tray notifications
        // (with default sound + vibration) directly — no browser permission
        // prompt needed, works while the app is backgrounded.
        try {
          if (window.MunnaOrderBridge && typeof window.MunnaOrderBridge.ensurePermission === 'function') {
            var ensured = window.MunnaOrderBridge.ensurePermission();
            if (ensured !== false) return Promise.resolve(true);
          }
        } catch (eBridge) {}
        if (!('Notification' in window) || Notification.permission === 'denied') return Promise.resolve(false);
        if (Notification.permission === 'granted') return Promise.resolve(true);
        try { return Notification.requestPermission().then(function (p) { return p === 'granted'; }).catch(function () { return false; }); }
        catch (e) { return Promise.resolve(false); }
      };
    </script>

<div id="app"></div>

  <!-- PULL-TO-REFRESH bubble (Chrome-style): pull down from the top on ANY
       screen (Home + Cart/Orders/Address/Profile) to refresh live data.
       Lives OUTSIDE #app so the page-loader injection never wipes it. -->
  <div id="ptrIndicator" class="ptr-indicator" aria-hidden="true">
    <div class="ptr-spinner"><i class="ph-bold ph-arrow-down" id="ptrArrow"></i></div>
    <span id="ptrText">ତଳକୁ ଟାଣନ୍ତୁ — ରିଫ୍ରେସ୍ ପାଇଁ</span>
  </div>

  <!-- ================= PAGE LOADER =================
       Every screen lives in pages/*.html and is injected into #app first;
       then js/*.js run in the exact order of the original single inline
       script. init.js starts the app (DOMContentLoaded guard). -->
  <script>
    var MUNNA_PAGES = ['home', 'product', 'cart', 'orders', 'address', 'profile', 'modal-admin-login', 'modal-order-alert', 'admin', 'scanner', 'modal-login'];
    var MUNNA_SCRIPTS = ['core', 'catalog', 'checkout', 'product-detail', 'navigation', 'admin', 'admin-settings', 'image-search', 'admin-catalog', 'data-helpers', 'sheet-post', 'sheet-sync', 'address', 'profile', 'scanner', 'auth', 'pull-refresh', 'init'];

    function munnaFetchPage(n) {
      return fetch('pages/' + n + '.html').then(function (r) {
        if (!r.ok) throw new Error('page ' + n + ' HTTP ' + r.status);
        return r.text();
      });
    }
    function munnaLoadScript(src) {
      return new Promise(function (res, rej) {
        var s = document.createElement('script');
        s.src = src; s.onload = function () { res(); };
        s.onerror = function () { rej(new Error('script failed: ' + src)); };
        document.body.appendChild(s);
      });
    }
    window.MUNNA_BOOT = (async function () {
      var parts = await Promise.all(MUNNA_PAGES.map(munnaFetchPage));
      document.getElementById('app').innerHTML = parts.join('\n');
      for (var i = 0; i < MUNNA_SCRIPTS.length; i++) {
        await munnaLoadScript('js/' + MUNNA_SCRIPTS[i] + '.js');
      }
      document.dispatchEvent(new Event('munna:ready'));
    })().catch(function (e) { console.error('MUNNA boot failed:', e); });
  </script>
