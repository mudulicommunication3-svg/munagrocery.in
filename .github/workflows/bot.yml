name: Run Telegram Bot (cloud, no PC needed)

# ============================================================================
#  Runs the MUNNA MOBILE & Grocery Telegram bot directly from Git (the cloud),
#  so the bot no longer depends on your PC staying on.
#
#  How it works:
#    * A scheduled job starts the bot, keeps it online ~6 hours (GitHub's
#      hard limit), then the next run takes over  ->  bot stays online 24/7
#      with only a ~1-2 minute gap each cycle.
#    * Messages are NOT lost while offline: Telegram stores them and the bot
#      picks them up (getUpdates offset) on the next run.
#
#  ONE-TIME SETUP (required):
#    Add these two Repository Secrets in GitHub:
#      Settings -> Secrets and variables -> Actions -> New repository secret
#        1. BOT_ENV            = full contents of  shopbot/.env
#        2. GOOGLE_CREDENTIALS = full contents of  shopbot/credentials.json
#    (Never paste secrets into this file - they are injected at run time.)
#
#  IMPORTANT: once this runs, STOP the bot on your PC. Two bot instances at
#  the same time cause a Telegram "Conflict" and neither answers.
# ============================================================================

on:
  workflow_dispatch:            # manual "Run workflow" button
  schedule:
    - cron: "0 */6 * * *"       # every 6 hours (job self-limits to ~5h55m)

# Only ONE bot instance may run at a time -> prevents Telegram Conflict.
concurrency:
  group: telegram-bot
  cancel-in-progress: true      # a new run replaces the old one (acts as restart)

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355        # stay under GitHub's 6h (360 min) hard limit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore secrets (.env + credentials.json)
        env:
          BOT_ENV: ${{ secrets.BOT_ENV }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          set -e
          if [ -z "$BOT_ENV" ]; then echo "::error::BOT_ENV secret is empty. Add it in repo Settings -> Secrets."; exit 1; fi
          if [ -z "$GOOGLE_CREDENTIALS" ]; then echo "::error::GOOGLE_CREDENTIALS secret is empty. Add it in repo Settings -> Secrets."; exit 1; fi
          printf '%s' "$BOT_ENV" > shopbot/.env
          printf '%s' "$GOOGLE_CREDENTIALS" > shopbot/credentials.json
          echo "Secrets restored."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r shopbot/requirements.txt

      - name: Run bot until next cycle
        # CRITICAL: run from shopbot/ so the .env relative paths resolve.
        # GOOGLE_SHEETS_CREDENTIALS_FILE=credentials.json is relative, and
        # credentials.json is written to shopbot/ - running from the repo root
        # made the file "not found" and broke the Sheet search bus.
        working-directory: shopbot
        run: python main.py
